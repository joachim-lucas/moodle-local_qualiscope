name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        options: >-
          --health-cmd "mariadb-admin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
          - php: '8.3'
            moodle-branch: MOODLE_502_STABLE
            database: mariadb
          - php: '8.4'
            moodle-branch: MOODLE_502_STABLE
            database: pgsql

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli
          ini-values: max_input_vars=5000
          coverage: none
          tools: composer

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && vendor/bin/phpunit --version)
          echo $(pwd)/ci/bin >> $GITHUB_PATH
          echo $GITHUB_WORKSPACE >> $GITHUB_PATH
          echo $GITHUB_WORKSPACE/plugin >> $GITHUB_PATH
          php $(pwd)/ci/bin/moodle-plugin-ci.phar install \
            --plugin ./plugin \
            --db-host=127.0.0.1 \
            --db-port=5432 \
            --db-name=moodle \
            --db-user=postgres \
            --db-pass= \
            --db-type=pgsql
          php $(pwd)/ci/bin/moodle-plugin-ci.phar install \
            --plugin ./plugin \
            --db-host=127.0.0.1 \
            --db-port=3306 \
            --db-name=moodle \
            --db-user=root \
            --db-pass= \
            --db-type=mysqli

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdocs

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --coverage-clover

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat